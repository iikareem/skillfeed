{
  "name": "bug_report",
  "description": "Report a bug in Skillfeed",
  "title": "[Bug]: ",
  "labels": ["bug"],
  "body": [
    {
      "type": "textarea",
      "id": "describe",
      "attributes": {
        "label": "Describe the bug",
        "description": "A clear summary of what went wrong"
      },
      "validations": { "required": true }
    },
    {
      "type": "textarea",
      "id": "reproduce",
      "attributes": {
        "label": "Steps to reproduce",
        "placeholder": "1. Select platforms…\n2. Rank feed…\n3. See error…"
      },
      "validations": { "required": true }
    },
    {
      "type": "textarea",
      "id": "expected",
      "attributes": {
        "label": "Expected behavior"
      }
    },
    {
      "type": "input",
      "id": "env",
      "attributes": {
        "label": "Environment",
        "placeholder": "e.g. local / Vercel production, browser"
      }
    }
  ]
}
